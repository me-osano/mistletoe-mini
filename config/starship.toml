add_newline = true

format = """
$directory $git_branch$git_status\
$fill\
$python\
$lua\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$docker_context
$character
"""

command_timeout = 200

[fill]
symbol = " "

[character]                    
success_symbol = "[╰─  ](bold fg:cyan)"
error_symbol = "[╰─  ](bold fg:red)"

[git_branch]
style = "italic cyan"
symbol = "󰘬"
format = "[$symbol $branch(:$remote_branch)]($style)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = " ?"
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[directory]
#home_symbol = "  "
read_only = "  "
style = "fg:green"
truncation_length = 0
truncate_to_repo = false
truncation_symbol = " ••/"
format = '[╭─ $path]($style)'

[cmd_duration]
# min_time = 0
format = '[󰪢 $duration](bold fg:green)'

[c]
symbol = " "
style = "bg:cyan fg:black"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:green fg:black"
format = '[ $symbol $context ]($style)$path'

[elixir]
symbol = " "
style = "bg:cyan fg:black"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:cyan fg:black"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = " "
style = "bg:cyan fg:black"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:cyan fg:black"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:cyan fg:black"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:cyan fg:black"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:cyan fg:black"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = " "
style = "bg:cyan fg:black"
format = '[ $symbol ($version) ]($style)'

[python]
style = "bg:green fg:black"
format = '[(\($virtualenv\))]($style)  '

[rust]
symbol = ""
style = "bg:cyan fg:black"
format = '[ $symbol ($version) ]($style)'